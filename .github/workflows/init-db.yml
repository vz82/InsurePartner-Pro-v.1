name: Initialize Database Schema

on:
  push:
    branches:
      - main
    paths:
      - 'Database/**'
  workflow_dispatch:

jobs:
  init-database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: insurance_partners
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if PGPASSWORD=postgres psql -h localhost -U postgres -d insurance_partners -c "SELECT 1" 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Initialize database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d insurance_partners -f Database/001_InitialSchema.sql

      - name: Verify schema creation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d insurance_partners -c "\dt"
          psql -h localhost -U postgres -d insurance_partners -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public';"

      - name: Schema initialization successful
        run: echo "Database schema has been successfully initialized!"
